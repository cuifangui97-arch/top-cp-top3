    .game-shell{width:min(1120px,100%);margin:auto;padding:20px clamp(14px,3vw,42px) 32px}.game-top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:26px}.back{border:0;background:transparent;color:#fff;font-weight:850;padding:10px 0;cursor:pointer}.count{color:#aaaab5;font-size:.86rem}.count strong{color:#fff;font-size:1.15rem}.progress{height:5px;background:#292933;border-radius:9px;overflow:hidden}.progress i{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--hot),#ff9a75);transition:width .35s ease}.round{text-align:center;padding:28px 0 23px}.round p{margin:0 0 8px;color:var(--hot);font-weight:900;letter-spacing:.18em;font-size:.77rem}.round h2{margin:0;font-size:clamp(1.5rem,4vw,2.55rem);letter-spacing:-.04em}.round small{display:block;margin-top:9px;color:#858590}
    .duel{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:clamp(12px,3vw,30px)}.choice{border:0;padding:0;background:var(--paper);color:var(--ink);border-radius:4px;overflow:hidden;cursor:pointer;box-shadow:var(--shadow);text-align:left;transition:.22s transform,.22s box-shadow}.choice:hover{transform:translateY(-6px);box-shadow:0 32px 82px rgba(0,0,0,.38)}.photo{position:relative;aspect-ratio:4/5;overflow:hidden;background:#d8d5cf}.photo img{width:100%;height:100%;object-fit:cover;transition:.5s transform}.choice:hover img{transform:scale(1.025)}.num{position:absolute;left:13px;top:13px;display:grid;place-items:center;width:35px;height:35px;background:rgba(13,13,18,.85);color:#fff;border-radius:50%;font-size:.78rem;font-weight:900}.choice-copy{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:17px 19px 19px}.choice-copy strong{display:block;font-size:clamp(1.25rem,3vw,2rem);letter-spacing:-.04em}.choice-copy span{display:block;margin-top:4px;color:#6d6d74;font-size:.84rem}.pick{font-weight:950;color:var(--hot);font-size:.8rem}.vs{display:grid;place-items:center;width:58px;height:58px;border:1px solid #3b3b45;border-radius:50%;font-weight:950;font-style:italic;color:var(--hot)}
    .duel [hidden]{display:none}
    .tools{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:22px}.tool{border:1px solid #34343e;background:#17171e;color:#cfcfd6;border-radius:999px;padding:10px 16px;cursor:pointer}.tool.skip{border-color:#ff7387;color:#ffabb7}.tool:disabled{opacity:.35;cursor:not-allowed}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,18px);padding:11px 17px;background:#fff;color:#15151b;border-radius:999px;font-weight:800;opacity:0;pointer-events:none;transition:.25s;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}
    .result-shell{width:min(920px,100%);margin:auto;padding:24px clamp(18px,4vw,48px) 55px}.result-head{text-align:center;padding:34px 0 28px}.result-head p{margin:0;color:var(--hot);font-size:.76rem;font-weight:900;letter-spacing:.2em}.result-head h2{margin:10px 0 0;font-size:clamp(2.5rem,8vw,5.6rem);letter-spacing:-.07em;line-height:.93}.podium{display:grid;grid-template-columns:1fr 1.14fr 1fr;gap:14px;align-items:end;margin-top:25px}.rank-card{position:relative;background:var(--paper);color:var(--ink);padding:8px 8px 18px;box-shadow:var(--shadow)}.rank-card:nth-child(2){order:-1}.rank-card.first{transform:translateY(-28px)}.rank-photo{aspect-ratio:3/4;overflow:hidden;background:#ddd}.rank-photo img{width:100%;height:100%;object-fit:cover}.medal{position:absolute;top:-17px;left:50%;transform:translateX(-50%);display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--hot);color:#fff;font-size:1.15rem;font-weight:950;box-shadow:0 8px 20px rgba(0,0,0,.25)}.rank-card h3{margin:14px 8px 3px;font-size:clamp(1.1rem,3vw,1.65rem);letter-spacing:-.04em}.rank-card p{margin:0 8px;color:#777780;font-size:.76rem}.actions{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:22px}.actions button{border:0;border-radius:999px;padding:13px 19px;font-weight:900;cursor:pointer}.primary{background:var(--hot);color:#fff}.secondary{background:#25252e;color:#fff}.all-list{margin-top:38px;border-top:1px solid #2d2d36;padding-top:22px}.all-list summary{cursor:pointer;color:#a9a9b2;text-align:center}.ranking{display:grid;gap:8px;margin-top:18px}.ranking-row{display:grid;grid-template-columns:30px 48px 1fr;gap:11px;align-items:center;padding:9px;background:#18181f;border-radius:8px}.ranking-row img{width:48px;height:48px;object-fit:cover;border-radius:6px}.ranking-row b{font-size:.95rem}.ranking-row small{display:block;color:#7f7f89;margin-top:2px}
    @media(max-width:760px){.shell{padding-top:20px}.hero{grid-template-columns:1fr;padding-top:44px}.hero h1{font-size:clamp(3.4rem,19vw,6rem)}.deck{min-height:390px;margin-top:8px}.deck-card{width:58%;max-width:250px}.deck-card:nth-child(2){right:2%}.deck-card:nth-child(3){top:130px}.game-shell{padding-top:13px}.round{padding:17px 0 18px}.duel{gap:7px;grid-template-columns:1fr 34px 1fr}.vs{width:34px;height:34px;font-size:.72rem}.choice-copy{grid-template-columns:1fr;padding:11px}.choice-copy strong{font-size:1.2rem}.choice-copy span{font-size:.67rem;line-height:1.35}.pick{display:none}.photo{aspect-ratio:3/4}.num{width:29px;height:29px;left:8px;top:8px}.podium{gap:7px}.rank-card{padding:5px 5px 12px}.rank-card.first{transform:translateY(-18px)}.rank-card h3{margin:10px 4px 2px}.rank-card p{font-size:.6rem;margin:0 4px}.medal{width:34px;height:34px;top:-14px}.result-head{padding-top:18px}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

<body>
  <main class="app">
    <section id="home" class="screen active" aria-labelledby="hero-title">
      <div class="shell">
        <header class="brand"><div class="mark"><span class="mark-badge">T</span>TOP 登陆少年</div><span class="eyebrow">CP PICK · TOP 3</span></header>
        <div class="hero">
          <div><span class="eyebrow">18组CP · 连续二选一</span><h1 id="hero-title">选出你的<i>心选 TOP 3</i></h1><p class="lede">每次只凭这一刻的偏爱做选择。系统会不断重组对决，直到你的前三名依次落位。</p><button id="startBtn" class="start">开始测试 →</button><p class="mini">进度自动保存在当前设备 · 随时可以回来继续</p></div>
          <div class="deck" aria-hidden="true"><figure class="deck-card"><img src="assets/cp-04.webp" alt=""><span>04 · 棍铲</span></figure><figure class="deck-card"><img src="assets/cp-08.webp" alt=""><span>08 · 极航</span></figure><figure class="deck-card"><img src="assets/cp-11.webp" alt=""><span>11 · 铲棍</span></figure><div class="scribble">PICK YOUR 3</div></div>
        </div>
      </div>
    </section>

    <section id="game" class="screen" aria-labelledby="question">
      <div class="game-shell">
        <div class="game-top"><button class="back" id="homeBtn">← 返回首页</button><div class="count"><strong id="choiceCount">0</strong> 次选择</div></div><div class="progress" aria-label="测试进度"><i id="progressBar"></i></div>
        <div class="round"><p id="roundLabel">ROUND 01</p><h2 id="question">这一刻，你更偏爱哪一对？</h2><small id="phaseHint">点击照片完成选择，系统会继续重组对决。</small></div>
        <div class="duel"><button id="leftChoice" class="choice" aria-label="选择左侧CP"></button><div class="vs">VS</div><button id="rightChoice" class="choice" aria-label="选择右侧CP"></button></div>
        <div class="tools"><button id="undoBtn" class="tool">↶ 撤回</button><button id="skipBtn" class="tool skip" title="两组都退出本次排序">这两组都跳过</button><button id="saveBtn" class="tool">保存进度</button></div>
      </div>
    </section>

    <section id="result" class="screen" aria-labelledby="result-title">
      <div class="result-shell"><header class="brand"><div class="mark"><span class="mark-badge">T</span>TOP 登陆少年</div><span class="eyebrow">RESULT</span></header><div class="result-head"><p>MY CP PICK</p><h2 id="result-title">心选 TOP 3</h2></div><div id="podium" class="podium"></div><div class="actions"><button id="downloadBtn" class="primary">保存结果图</button><button id="shareBtn" class="secondary">分享结果</button><button id="restartBtn" class="secondary">重新测试</button></div><details class="all-list"><summary>查看完整排序</summary><div id="ranking" class="ranking"></div></details></div>
    </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
    const CPS=[
      {id:'cp01',name:'棍宝',pair:'朱志鑫 × 张泽禹',img:'assets/cp-01.webp'},
      {id:'cp02',name:'志极',pair:'朱志鑫 × 张极',img:'assets/cp-02.webp'},
      {id:'cp03',name:'左心房',pair:'左航 × 苏新皓',img:'assets/cp-10.webp'},
      {id:'cp04',name:'棍铲',pair:'朱志鑫 × 苏新皓',img:'assets/cp-04.webp'},
      {id:'cp05',name:'极禹',pair:'张极 × 张泽禹',img:'assets/cp-05.webp'},
      {id:'cp06',name:'航禹',pair:'左航 × 张泽禹',img:'assets/cp-06.webp'},
      {id:'cp07',name:'宝铲',pair:'张泽禹 × 苏新皓',img:'assets/cp-07.webp'},
      {id:'cp08',name:'极航',pair:'张极 × 左航',img:'assets/cp-08.webp'},
      {id:'cp09',name:'极皓',pair:'张极 × 苏新皓',img:'assets/cp-09.webp'},
      {id:'cp10',name:'鑫左',pair:'朱志鑫 × 左航',img:'assets/cp-03.webp'},
      {id:'cp11',name:'铲棍',pair:'苏新皓 × 朱志鑫',img:'assets/cp-11.webp'},
      {id:'cp12',name:'禹极',pair:'张泽禹 × 张极',img:'assets/cp-12.webp'},
      {id:'cp13',name:'芒猴',pair:'张泽禹 × 左航',img:'assets/cp-13.webp'},
      {id:'cp14',name:'宝棍',pair:'张泽禹 × 朱志鑫',img:'assets/cp-14.webp'},
      {id:'cp15',name:'航极',pair:'左航 × 张极',img:'assets/cp-15.webp'},
      {id:'cp16',name:'铲宝',pair:'苏新皓 × 张泽禹',img:'assets/cp-16.webp'},
      {id:'cp17',name:'苏左',pair:'苏新皓 × 左航',img:'assets/cp-17.webp'},
      {id:'cp18',name:'棍铲棍',pair:'朱志鑫 × 苏新皓 × 朱志鑫',img:'assets/cp-18.webp'}
    ];
    const KEY='top-cp-top3-v1'; let state=null; let toastTimer;
    const $=s=>document.querySelector(s); const byId=id=>CPS.find(x=>x.id===id);
    function shuffled(){const a=CPS.map(x=>x.id);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
    function fresh(){const order=shuffled();return{phase:'game',order,ranked:[order[0]],excluded:[],next:1,lo:0,hi:1,choices:0,history:[]}}
    function core(){return{phase:state.phase,order:[...state.order],ranked:[...state.ranked],excluded:[...(state.excluded||[])],next:state.next,lo:state.lo,hi:state.hi,choices:state.choices}}
    function persist(){localStorage.setItem(KEY,JSON.stringify(state))}
    function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(!s||!Array.isArray(s.order))return null;const ids=new Set(CPS.map(x=>x.id));if(new Set(s.order).size!==s.order.length||s.order.some(id=>!ids.has(id)))return null;if(s.order.length<CPS.length){const oldLength=s.order.length,missing=CPS.map(x=>x.id).filter(id=>!s.order.includes(id));if(![12,14,15].includes(oldLength))return null;s.order.push(...missing);if(s.phase==='result'){s.phase='game';s.next=oldLength;s.lo=0;s.hi=s.ranked.length;s.history=[]}else{s.history=(s.history||[]).map(h=>({...h,order:[...h.order,...missing.filter(id=>!h.order.includes(id))]}))}}if(s.order.length!==CPS.length)return null;s.excluded=s.excluded||[];return s}catch(e){return null}}
    function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id===id));window.scrollTo(0,0)}
    function notify(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1700)}
    function start(){state=load()||fresh();state.phase=state.phase==='result'?'result':'game';persist();render()}
    function current(){const candidate=state.order[state.next],mid=Math.floor((state.lo+state.hi)/2);return[candidate,state.ranked[mid]||null]}
    function pick(id){if(!state||state.phase!=='game')return;const [candidate,existing]=current();if(id!==candidate&&id!==existing)return;state.history=state.history||[];state.history.push(core());state.choices++;if(!existing){state.ranked.push(candidate);state.next++;if(state.next>=state.order.length)state.phase='result';else{state.lo=0;state.hi=state.ranked.length}}else{if(id===candidate)state.hi=Math.floor((state.lo+state.hi)/2);else state.lo=Math.floor((state.lo+state.hi)/2)+1;if(state.lo>=state.hi){state.ranked.splice(state.lo,0,candidate);state.next++;if(state.next>=state.order.length){state.phase='result'}else{state.lo=0;state.hi=state.ranked.length}}}persist();render()}
    function skipBoth(){if(!state||state.phase!=='game')return;const [candidate,existing]=current();state.history=state.history||[];state.history.push(core());state.excluded=state.excluded||[];for(const id of [candidate,existing])if(id&&!state.excluded.includes(id))state.excluded.push(id);state.ranked=state.ranked.filter(id=>id!==existing);state.choices++;state.next++;if(!state.ranked.length&&state.next<state.order.length-1){state.ranked.push(state.order[state.next]);state.next++}if(state.next>=state.order.length)state.phase='result';else{state.lo=0;state.hi=state.ranked.length}persist();render()}
    function undo(){if(!state?.history?.length)return;const history=state.history;const prev=history.pop();state={...prev,history};persist();render()}
    function choiceHTML(id){const x=byId(id),n=String(CPS.indexOf(x)+1).padStart(2,'0');return `<div class="photo"><img src="${x.img}" alt="${x.name}，${x.pair}合照"><span class="num">${n}</span></div><div class="choice-copy"><div><strong>${x.name}</strong><span>${x.pair}</span></div><b class="pick">选TA们 →</b></div>`}
    function renderGame(){show('game');const [a,b]=current(),solo=!b;$('#leftChoice').innerHTML=choiceHTML(a);$('#leftChoice').onclick=()=>pick(a);$('#rightChoice').hidden=solo;$('.vs').hidden=solo;$('.duel').style.gridTemplateColumns=solo?'minmax(0, 360px)':'1fr auto 1fr';$('.duel').style.justifyContent=solo?'center':'';if(b){$('#rightChoice').innerHTML=choiceHTML(b);$('#rightChoice').onclick=()=>pick(b)}$('#skipBtn').textContent=solo?'跳过这组':'这两组都跳过';$('#question').textContent=solo?'这组要留下吗？':'这一刻，你更偏爱哪一对？';$('#choiceCount').textContent=state.choices;$('#roundLabel').textContent='ROUND '+String(state.choices+1).padStart(2,'0');$('#phaseHint').textContent=solo?'点照片留下，或选择跳过。':`正在整理第 ${Math.min(state.next+1,CPS.length)} / ${CPS.length} 组CP · 两组都不喜欢可以一起跳过`;$('#progressBar').style.width=Math.round((state.next/CPS.length)*100)+'%';$('#undoBtn').disabled=!state.history?.length}
    function renderResult(){show('result');const top=state.ranked.slice(0,3);$('#result-title').textContent=top.length===3?'心选 TOP 3':top.length?`留下的 ${top.length} 组CP`:'没有留下喜欢的CP';$('#podium').innerHTML=top.map((id,i)=>{const x=byId(id);return `<article class="rank-card ${i===0?'first':''}" style="${i===0?'grid-column:2':''}"><span class="medal">${i+1}</span><div class="rank-photo"><img src="${x.img}" alt="${x.name}"></div><h3>${x.name}</h3><p>${x.pair}</p></article>`}).join('');$('#podium').style.display=top.length?'grid':'none';$('#downloadBtn').disabled=!top.length;$('#ranking').innerHTML=(state.ranked.map((id,i)=>{const x=byId(id);return `<div class="ranking-row"><span>${i+1}</span><img src="${x.img}" alt=""><div><b>${x.name}</b><small>${x.pair}</small></div></div>`}).join('')||'<p>没有留下喜欢的CP</p>')+(state.excluded?.length?`<p>跳过 ${state.excluded.length} 组：${state.excluded.map(id=>byId(id).name).join('、')}</p>`:'')}
    function render(){if(!state){show('home');const saved=load();$('#startBtn').textContent=saved?(saved.phase==='result'?'查看上次结果 →':'继续测试 →'):'开始测试 →';return}state.phase==='result'?renderResult():renderGame()}
    async function share(){const names=state.ranked.slice(0,3).map((id,i)=>`${i+1}.${byId(id).name}`).join('  '),text=names?`我的TOP登陆少年CP TOP 3：${names}`:'这次没有留下喜欢的CP',url=new URL('./?cover=kun-chan',location.href).href;try{if(navigator.share)await navigator.share({title:'我的CP TOP 3',text,url});else{await navigator.clipboard.writeText(text+' '+url);notify('结果已复制')}}catch(e){if(e.name!=='AbortError')notify('暂时无法分享')}}
    async function download(){const top=state.ranked.slice(0,3).map(byId),c=document.createElement('canvas'),ctx=c.getContext('2d');c.width=1080;c.height=1350;ctx.fillStyle='#101016';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#ff425d';ctx.fillRect(70,65,70,70);ctx.fillStyle='#fff';ctx.font='900 42px sans-serif';ctx.fillText('T',92,116);ctx.font='900 72px sans-serif';ctx.fillText('MY CP TOP 3',170,121);const imgs=await Promise.all(top.map(x=>new Promise((res,rej)=>{const im=new Image;im.onload=()=>res(im);im.onerror=rej;im.src=x.img})));const xs=[390,70,710],ys=[235,335,335],ws=[300,300,300],hs=[450,450,450];top.forEach((x,i)=>{const im=imgs[i],r=Math.max(ws[i]/im.width,hs[i]/im.height),sw=ws[i]/r,sh=hs[i]/r,sx=(im.width-sw)/2,sy=(im.height-sh)/2;ctx.drawImage(im,sx,sy,sw,sh,xs[i],ys[i],ws[i],hs[i]);ctx.fillStyle='#f4f1eb';ctx.fillRect(xs[i],ys[i]+hs[i],ws[i],125);ctx.fillStyle='#15151b';ctx.font='900 43px sans-serif';ctx.fillText(x.name,xs[i]+22,ys[i]+hs[i]+58);ctx.font='25px sans-serif';ctx.fillStyle='#73737d';ctx.fillText(x.pair,xs[i]+22,ys[i]+hs[i]+98);ctx.fillStyle='#ff425d';ctx.beginPath();ctx.arc(xs[i]+ws[i]-26,ys[i]+20,34,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='900 32px sans-serif';ctx.textAlign='center';ctx.fillText(String(i+1),xs[i]+ws[i]-26,ys[i]+31);ctx.textAlign='left'});ctx.fillStyle='#7f7f8b';ctx.font='27px sans-serif';ctx.fillText('TOP登陆少年 · 18组CP心选测试',70,1265);c.toBlob(blob=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='TOP-CP-TOP3.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},'image/png')}
    function registerTools(){const mc=document.modelContext;if(!mc?.registerTool)return;const reg=t=>{try{Promise.resolve(mc.registerTool(t)).catch(()=>{})}catch(e){}};reg({name:'read_cp_test_state',title:'查看CP测试状态',description:'查看TOP登陆少年CP TOP 3测试的当前状态、对决选项或结果。',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:false},execute:()=>state?{phase:state.phase,choicesMade:state.choices,currentOptions:state.phase==='game'?current().map(byId):[],topThree:state.phase==='result'?state.ranked.slice(0,3).map(byId):[],excluded:state.excluded||[]}:{phase:'home'}});reg({name:'open_cp_test',title:'进入CP测试',description:'开始测试或打开当前设备保存的测试进度。',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute:()=>{start();return{phase:state.phase}}});reg({name:'choose_current_cp',title:'选择当前CP',description:'在当前二选一对决中选择指定CP并推进测试。cpId必须来自当前选项。',inputSchema:{type:'object',properties:{cpId:{type:'string'}},required:['cpId'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute:({cpId})=>{const opts=current();if(!opts.includes(cpId))throw new Error('cpId不在当前选项中');pick(cpId);return{phase:state.phase,choicesMade:state.choices}}});reg({name:'skip_current_cp_pair',title:'跳过当前两组CP',description:'把当前对决的两组CP都排除在结果之外并继续测试。',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute:()=>{if(state?.phase!=='game')throw new Error('当前没有对决');skipBoth();return{phase:state.phase,choicesMade:state.choices,excluded:state.excluded}}});reg({name:'undo_last_cp_choice',title:'撤回上次选择',description:'撤回最近一次CP选择或跳过。',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute:()=>{if(!state?.history?.length)throw new Error('没有可撤回的选择');undo();return{phase:state.phase,choicesMade:state.choices}}})}
    $('#startBtn').onclick=start;$('#homeBtn').onclick=()=>{state=null;render()};$('#undoBtn').onclick=undo;$('#skipBtn').onclick=skipBoth;$('#saveBtn').onclick=()=>{persist();notify('进度已保存')};$('#restartBtn').onclick=()=>{localStorage.removeItem(KEY);state=fresh();persist();render()};$('#shareBtn').onclick=share;$('#downloadBtn').onclick=download;window.addEventListener('keydown',e=>{if(state?.phase!=='game')return;if(e.key==='ArrowLeft')$('#leftChoice').click();if(e.key==='ArrowRight')$('#rightChoice').click()});render();registerTools();
